name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Supabase security checklist (static)
        run: npm run verify:supabase-security

      - name: Service-role scope checklist (static)
        run: npm run verify:service-role

      - name: Public API PII smoke (production)
        run: npm run verify:api-pii
